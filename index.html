<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Playground</title>
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="manifest" href="favicon/site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>

    <div class="bg-layer"></div>
    <!-- <div class="grid-overlay"></div> -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="scene">
        <div class="card">
            <div class="card-depth"></div>

            <!-- Heading -->
            <div class="header">
                <h1 class="heading">Prompt <span>Playground</span></h1>
                <p class="subheading">Experiment. Refine. Create.</p>
            </div>

            <!-- Input -->
            <div class="section">
                <div class="label">
                    <span class="material-symbols-outlined">
                        edit
                    </span>
                    Your Prompt
                </div>
                <div class="textarea-wrap">
                    <textarea id="userPromptInput" class="textarea"
                        placeholder="e.g. Explain quantum entanglement like I'm five years old…"></textarea>
                </div>
            </div>

            <!-- Button -->
            <div class="section">
                <div class="btn-wrap">
                    <button id="btnGenerate" class="btn-generate">
                        <span class="material-symbols-outlined generate-icon">
                            wand_shine
                        </span>
                        Generate Response
                    </button>
                    <button id="btnClear" class="btn-clear">
                        <span class="material-symbols-outlined clear-icon">
                            delete
                        </span>
                    </button>
                </div>
            </div>

            <!-- Output -->
            <div class="section" style="margin-bottom:0;">
                <div class="label">
                    <div class="label-icon">
                        <span class="material-symbols-outlined">
                            chat
                        </span>
                    </div>
                    Output
                </div>
                <div class="output-box">
                    <div class="output-placeholder">
                        <p id="divOutput" class="output-hint">
                            <strong>No output yet</strong>
                            Enter a prompt above and hit Generate
                        </p>
                    </div>
                </div>
            </div>

        </div>
        <div class="card-shadow"></div>
    </div>
</body>

</html>
